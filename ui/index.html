<!doctype html>
<html lang="ko" data-zero-hosted="true">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://zero-lobby.zero-cloudflare.workers.dev; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>ZERO</title>
  <meta name="description" content="내 자산, 오늘 시장, 관심 종목을 한 화면에서 보는 ZERO">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="assets/manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ZERO">
  <meta name="theme-color" content="#ffffff">
  <meta name="zero-lobby-api" content="https://zero-lobby.zero-cloudflare.workers.dev">
  <script src="assets/theme-boot.js"></script>
  <link rel="stylesheet" href="assets/zero.css">
  <script src="assets/vendor-lightweight-charts-4.1.3.js" defer></script>
  <script src="assets/zero-core.js" defer></script>
  <script src="assets/outlook.js" defer></script>
  <script src="assets/academy-logic.js" defer></script>
  <script src="assets/zero-ui.js" defer></script>
  <script src="assets/zero-data.js" defer></script>
  <script src="assets/zero-home.js" defer></script>
  <script src="assets/zero-stocks.js" defer></script>
  <script src="assets/zero-discover.js" defer></script>
  <script src="assets/zero-more.js" defer></script>
  <script src="assets/zero-school.js" defer></script>
  <script src="assets/zero-app.js" defer></script>
</head>
<body>
<a class="skip-link" href="#main">본문으로 이동</a>

<header class="top">
  <div class="top-inner">
    <a class="brand" href="#home" aria-label="ZERO 홈">ZERO</a>
    <nav class="tabs" aria-label="주요 화면">
      <a href="#home" data-tab="home">홈</a>
      <a href="#stocks" data-tab="stocks">내 주식</a>
      <a href="#discover" data-tab="discover">발견</a>
      <a href="#more" data-tab="more">더보기</a>
    </nav>
    <div class="search" role="search">
      <label class="sr-only" for="search">종목 검색</label>
      <input id="search" type="search" placeholder="종목 이름이나 코드" autocomplete="off" role="combobox" aria-controls="search-results" aria-expanded="false">
      <ul id="search-results" class="search-results" role="listbox" aria-label="검색 결과" hidden></ul>
    </div>
    <button id="theme-toggle" class="icon-button" type="button" aria-label="화면 색 바꾸기"></button>
  </div>
</header>

<main id="main">
  <section id="view-home" class="view"><p class="empty loading" role="status">불러오는 중이에요</p></section>
  <section id="view-stocks" class="view" hidden></section>
  <section id="view-discover" class="view" hidden></section>
  <section id="view-stock" class="view" hidden></section>
  <section id="view-more" class="view" hidden></section>
  <noscript><p class="empty">이 화면은 자바스크립트를 켜야 볼 수 있어요.</p></noscript>
</main>

<footer class="foot">
  <p>ZERO는 공부와 참고용이에요. 주문을 내지 않고 투자 권유를 하지 않아요.</p>
</footer>

<nav class="tabbar" aria-label="주요 화면">
  <a href="#home" data-tab="home"><span data-icon="home"></span>홈</a>
  <a href="#stocks" data-tab="stocks"><span data-icon="wallet"></span>내 주식</a>
  <a href="#discover" data-tab="discover"><span data-icon="search"></span>발견</a>
  <a href="#more" data-tab="more"><span data-icon="menu"></span>더보기</a>
</nav>

<dialog id="sheet" class="sheet" aria-labelledby="sheet-title">
  <header class="sheet-head">
    <h2 id="sheet-title"></h2>
    <button class="icon-button" type="button" data-close-dialog aria-label="닫기"></button>
  </header>
  <div id="sheet-body" class="sheet-body"></div>
</dialog>

<dialog id="school" class="sheet" aria-labelledby="school-title">
  <header class="sheet-head">
    <div>
      <h2 id="school-title">주식 입문 학교</h2>
      <p id="school-rank" class="note"></p>
    </div>
    <button class="icon-button" type="button" data-close-dialog aria-label="닫기"></button>
  </header>
  <div class="school-bar" aria-hidden="true"><span id="school-fill"></span></div>
  <div id="school-body" class="sheet-body"></div>
</dialog>
</body>
</html>
